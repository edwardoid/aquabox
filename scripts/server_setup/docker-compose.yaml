# Use root/example as user/password credentials
version: '3.1'

services:

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: aquabox_admin
      MONGO_INITDB_ROOT_PASSWORD: aquabox_password
    volumes:
      - './mongo_data:/data/db:rw'

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: aquabox_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: aquabox_password
      ME_CONFIG_MONGODB_URL: mongodb://aquabox_admin:aquabox_password@mongo:27017/

  aquabox:
    restart: always
    ports:
      - 1213:1213
      - 1214:1214
      - 5555:5555
      - 5556:5556 
    volumes:
      - './server/config.json:/aquabox/bin/config.json:rw'
    build:
      context: .
      dockerfile: $PWD/AquaboxServer.docker
 
