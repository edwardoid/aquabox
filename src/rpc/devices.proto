syntax = "proto3";

package aquabox.services;

import public "types.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/any.proto";

message SetValueRequest {
    string deviceId = 1;
    string property = 2;
    double value = 3;
}

message GetPropertyValueRequest {
    string deviceId = 1;
    string property = 2;
}

service DevicesService {
    rpc Update(DeviceData) returns (google.protobuf.BoolValue);
    rpc Get(google.protobuf.StringValue) returns (DeviceData);
    rpc Set(SetValueRequest) returns (google.protobuf.BoolValue);
    rpc GetAll(google.protobuf.Empty) returns (stream DeviceData);
    rpc FetchProperties(google.protobuf.StringValue) returns (stream google.protobuf.StringValue);
    rpc RulesEnabled(google.protobuf.StringValue) returns (google.protobuf.BoolValue);
    rpc PropertyValue(GetPropertyValueRequest) returns (google.protobuf.DoubleValue);
}