syntax = "proto3";

package aquabox.services;
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

message SettingsSetIntRequest {
    string key = 1;
    int32 value = 2;
}

message SettingsSetStringRequest {
    string key = 1;
    string value = 2;
}

service SettingsProvider {
    rpc GetInt(google.protobuf.StringValue) returns (google.protobuf.Int32Value);
    rpc SetInt(SettingsSetIntRequest) returns (google.protobuf.Empty);

    rpc GetString(google.protobuf.StringValue) returns (google.protobuf.StringValue);
    rpc SetString(SettingsSetStringRequest) returns (google.protobuf.Empty);

    rpc AllocatePort(google.protobuf.StringValue) returns (google.protobuf.UInt32Value) {};
    rpc GetPort(google.protobuf.StringValue) returns (google.protobuf.UInt32Value) {};
}
