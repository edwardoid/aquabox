syntax = "proto3";

package aquabox;

message NetworkInfo {
    string UUID = 1;
    string SSID = 2;
    int32 strength = 3;

    enum Mode {
        Unsecure = 0;
        Secure = 0;
    }

    Mode mode = 4;
}

message NetworkConnectRequest {
    string SSID;
    string Password;
}

message ConnectionStatus {
    string SSID;

    enum Status {
        Disconnecting,
        Connecting,
        Authentificating,
        Connected,
        Failed
    };

    Status status;
}

service NetworkManager {
    rpc GetCurrentNetwork() returns (NetworkInfo) {};
    rpc IsConnectedToInternet() returns (bool) {};
    rpc Connect(NetworkConnectRequest) return (stream ConnectionStatus) {};
    rpc StartHotspot() return () {}
    rpc StopHotspot() return () {}
    rpc CurrentNetworkChanged() returns (stream NetworkInfo) {};
}