<ons-page>
    <div ng-controller="DevicesListController as devices" ng-init="devices.load()">
    <ons-toolbar>
        <div class="center">
            AquaBox
        </div>
        <div class="right">
            <ons-toolbar-button ng-click="openMenu()">
                <ons-icon icon="md-menu"></ons-icon>
            </ons-toolbar-button>
        </div>
        <div class="left">
            <ons-back-button>Back</ons-back-button>
        </div>
    </ons-toolbar>

    <ons-pull-hook ng-action="devices.load($done)" var="loader">
      <span ng-switch="loader.state">
        <span ng-switch-when="initial"><ons-icon size="35px" icon="ion-arrow-down-a"></ons-icon> Pull down to refresh</span>
        <span ng-switch-when="preaction"><ons-icon size="35px" icon="ion-arrow-up-a"></ons-icon> Release to refresh</span>
        <span ng-switch-when="action"><ons-icon size="35px" spin="true" icon="ion-load-d"></ons-icon> Loading data...</span>
      </span>
    </ons-pull-hook>

    <ons-card ng-repeat="device in devices.devices" id="{{device.id}}" onclick="
            var e = document.querySelector('#' + id + 'Details')
            e.hidden = !e.hidden;
        ">
        <ons-row>
            <ons-col width="10%">
            <img src="static/img/logos/{{device.meta.vendor}}.png" alt="" style="width: 100%">
            </ons-col>
            <ons-col width="5%">
            </ons-col>
            <ons-col width="85%" vertical-align="top">    
                <div class="title">{{device.name}}</div>
                <div id="{{device.id}}Details" class="content" hidden="true">
                        <ons-list>
                            <ons-list-header>Details</ons-list-header>
                            <ons-list-item>Class: {{device.class}}</ons-list-item>
                            <ons-list-item>Type: {{device.type}}</ons-list-item>
                        </ons-list>
                </div>
            </ons-col>
        </ons-row>
    </ons-card>
    </div>
</ons-page>
