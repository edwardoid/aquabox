<ons-page ng-controller="DevicesListController as devices" ng-init="devices.load()">
    <ons-pull-hook ng-action="devices.load($done)" var="loader">
        <span ng-switch="loader.state">
            <span ng-switch-when="initial">
                <ons-icon size="35px" icon="ion-arrow-down-a"></ons-icon> Pull down to refresh
            </span>
            <span ng-switch-when="preaction">
                <ons-icon size="35px" icon="ion-arrow-up-a"></ons-icon> Release to refresh
            </span>
            <span ng-switch-when="action">
                <ons-icon size="35px" spin="true" icon="ion-load-d"></ons-icon> Loading data...
            </span>
        </span>
    </ons-pull-hook>

    <ons-card ng-repeat="device in devices.devices">
        <div class="title" id="{{device.id}}" onclick="
                var s = '#' + id + 'Details'
                var e = document.querySelector(s)
                e.hidden = !e.hidden;
                var i = document.querySelector('#' + id + 'Expand')
                e.hidden ? i.setAttribute('rotate', '0')
                        : i.setAttribute('rotate', '180')
            ">
            <ons-row>
                <img src="static/img/logos/{{device.meta.vendor}}.png" alt="" style="width: 15%; height: 15%">
                <div style="width: 80%">
                    <ons-col vertical-align="center">
                        <p style="margin-left: 2%">{{device.name}}</p>
                    </ons-col>
                </div>
                <ons-col vertical-align="bottom">
                    <ons-icon id="{{device.id}}Expand" icon="md-chevron-down" />
                </ons-col>
            </ons-row>
        </div>
        <div id="{{device.id}}Details" class="content" hidden="true">
            <ons-row>
                <div style="width: 15%"></div>
                <ons-list style="width: 85%">
                    <ons-list-header>Details</ons-list-header>
                    <ons-list-item>Class: {{device.class}}</ons-list-item>
                    <ons-list-item>Type: {{device.type}}</ons-list-item>
                </ons-list>
            </ons-row>
            <ons-row style="margin-top: 2%">
                <div style="width: 86%"></div>
                <ons-button ng-controller="PageCtrl as pc" style="margin-left: 10px" onclick="pc.goTo('rules')">Rules</ons-button>
            </ons-row>
        </div>
    </ons-card>
</ons-page>
